<!-- Exemple de Formulaire HTML -->
<form id="formCommande">
  <input type="text" id="nom" placeholder="Votre nom" required />
  <input type="tel" id="telephone" placeholder="Numéro de téléphone" required />
  <input type="text" id="adresse" placeholder="Adresse de livraison" required />

  <!-- Bouton d'envoi -->
  <button type="button" onclick="envoyerCommande()">Commander maintenant</button>
</form>

<!-- Code JavaScript -->
<script>
  // 1. Mettez votre lien Google Web App ici :
  const SCRIPT_URL = "https://script.google.com/macros/s/VOTRE_ID_DEPLOIEMENT/exec";

  function envoyerCommande() {
    // Récupération des valeurs saisies par l'utilisateur
    const nomClient = document.getElementById("nom").value;
    const telClient = document.getElementById("telephone").value;
    const adresseClient = document.getElementById("adresse").value;

    // Vérification simple que les champs ne sont pas vides
    if (!nomClient || !telClient || !adresseClient) {
      alert("Veuillez remplir tous les champs !");
      return;
    }

    // Objet avec les données à envoyer
    const commande = {
      nom: nomClient,
      telephone: telClient,
      adresse: adresseClient,
      produit: "Nom du produit", // Adaptez selon le produit sélectionné
      prix: "2500 DA"            // Adaptez selon le prix du produit
    };

    // Envoi des données vers Google Sheets via Apps Script
    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(commande)
    })
    .then(() => {
      alert("Votre commande a été transmise avec succès !");
      // Optionnel : réinitialiser le formulaire
      document.getElementById("formCommande").reset();
    })
    .catch((error) => {
      console.error("Erreur lors de l'envoi :", error);
      alert("Une erreur est survenue, veuillez réessayer.");
    });
  }
</script>
